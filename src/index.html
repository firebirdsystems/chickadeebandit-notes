<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shared Notes</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           var(--hub-bg, #f9fafb);
      --card:         var(--hub-surface, #ffffff);
      --border:       var(--hub-border, #e5e7eb);
      --border-mid:   var(--hub-border, #d1d5db);
      --text:         var(--hub-text, #111827);
      --muted:        var(--hub-text-muted, #6b7280);
      --accent:       var(--hub-primary, #111827);
      --accent-fg:    var(--hub-primary-fg, #ffffff);
      --accent-hover: var(--hub-primary-hover, #374151);
      --radius:       var(--hub-radius, 0.5rem);
      --red: #dc2626; --red-light: #fee2e2;
    }

    body {
      font-family: var(--hub-font, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
      background: var(--bg); color: var(--text);
      min-height: 100vh; font-size: var(--hub-font-size, 15px); line-height: 1.5;
      padding: 24px;
    }

    .header {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 12px; margin-bottom: 24px; flex-wrap: wrap;
    }
    .header h1 { font-size: 1.4rem; font-weight: 700; }
    .header p  { font-size: 0.875rem; color: var(--muted); margin-top: 2px; }

    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px; border-radius: 8px; font-size: 0.875rem;
      font-weight: 600; cursor: pointer; border: none; transition: background .15s;
      white-space: nowrap;
    }
    .btn-primary { background: var(--accent); color: var(--accent-fg); }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-ghost { background: transparent; color: var(--muted); border: 1.5px solid var(--border-mid); }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
    .btn-sm { padding: 4px 10px; font-size: 0.8rem; }
    .btn-danger { background: transparent; color: var(--red); border: 1.5px solid #fca5a5; }
    .btn-danger:hover { background: var(--red-light); }
    .btn:disabled { opacity: .45; cursor: default; }

    /* ── Form card ── */
    .form-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px; margin-bottom: 20px;
    }
    .form-card h2 { font-size: 1rem; font-weight: 600; margin-bottom: 14px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
    .form-group input, .form-group textarea {
      width: 100%; border: 1.5px solid var(--border-mid); border-radius: 8px;
      padding: 8px 12px; font-size: 0.9rem; outline: none; font-family: inherit;
      background: var(--bg); color: var(--text); transition: border-color .15s;
    }
    .form-group input:focus, .form-group textarea:focus { border-color: var(--accent); }
    .form-group textarea { resize: vertical; min-height: 100px; }
    .form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

    /* ── Search row ── */
    .search-row { margin-bottom: 16px; }
    .search-input {
      width: 100%; border: 1.5px solid var(--border-mid); border-radius: 8px;
      padding: 8px 12px; font-size: 0.9rem; outline: none; font-family: inherit;
      background: var(--card); color: var(--text); transition: border-color .15s;
    }
    .search-input:focus { border-color: var(--accent); }

    /* ── Notes grid ── */
    .notes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }

    .note-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 18px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .note-card-header {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
    }
    .note-title { font-weight: 600; font-size: 0.95rem; }
    .note-actions { display: flex; gap: 4px; flex-shrink: 0; }
    .note-content { font-size: 0.875rem; color: var(--muted); white-space: pre-wrap; flex: 1; }
    .note-meta { font-size: 0.72rem; color: var(--muted); }

    /* ── Empty ── */
    .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
    .empty-icon { font-size: 2.5rem; margin-bottom: 10px; }

    /* ── Error ── */
    .error-banner {
      background: var(--red-light); color: var(--red); border-radius: 8px;
      padding: 10px 14px; font-size: 0.85rem; margin-bottom: 16px;
    }
  </style>
</head>
<body>

<div class="header">
  <div>
    <h1>Shared Notes</h1>
    <p>Notes visible to the whole family and AI agents</p>
  </div>
  <button class="btn btn-primary" id="new-btn" style="display:none">+ New Note</button>
</div>

<div id="error-area"></div>
<div id="form-area"></div>
<div class="search-row">
  <input id="search-input" class="search-input" type="search" placeholder="Search notes…" aria-label="Search notes" />
</div>
<div class="notes-grid" id="notes-grid">
  <div class="empty"><div class="empty-icon">📋</div><p>Loading…</p></div>
</div>

<script type="module">
import { esc, formatRelativeDate, hubConfirm, searchMatch, isAdult } from "/hub-sdk.js";
import { memberName as memberNameOf, mapNoteRows, searchableFields } from "./logic.js";

const DB = window.__DB_URL;
const CONTEXT = window.__CONTEXT_URL ?? "";
const HUB_MEMBER = window.__CURRENT_MEMBER ?? null;
const IS_ADULT  = isAdult(HUB_MEMBER);
const IS_ADMIN  = window.__IS_ADMIN === true;
const IS_ROSTER = window.__SPACE_KIND === "roster";
// Who may create, edit, or delete notes. In a roster (classroom / team /
// clients) only the steward — the space admin — writes; everyone else is
// read-only. Elsewhere any adult writes. The hub enforces this server-side
// (adult_writable + steward_writes_only on the notes table); this flag only
// hides controls that would otherwise fail with a policy error.
const CAN_WRITE = IS_ROSTER ? IS_ADMIN : IS_ADULT;

let notes = [];
let notesMap = new Map();
let members = [];
let membersMap = new Map();
let editingId = null;
let searchQ = "";

// ── D1 helper ─────────────────────────────────────────────────────────────────
async function db(sql, params = []) {
  const res = await fetch(DB, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sql, params }),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error ?? `DB error ${res.status}`);
  }
  return res.json();
}

// ── Load ──────────────────────────────────────────────────────────────────────
async function loadMembers() {
  if (!CONTEXT) return;
  try {
    const res = await fetch(`${CONTEXT}?keys=family.members`);
    members = ((await res.json())["family.members"]) ?? [];
    membersMap = new Map(members.map(m => [m.id, m]));
  } catch { members = []; }
}

function memberName(id) { return memberNameOf(membersMap, id); }

async function load() {
  try {
    const result = await db(
      "SELECT id, title, content, created_by, created_at, updated_at FROM app_notes__notes ORDER BY updated_at DESC"
    );
    notes = mapNoteRows(result.rows);
    notesMap = new Map(notes.map(n => [n.id, n]));
    render();
  } catch (e) {
    showError(e.message);
  }
}

// ── Render notes grid ─────────────────────────────────────────────────────────
function render() {
  const grid = document.getElementById("notes-grid");
  if (notes.length === 0) {
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1">
      <div class="empty-icon">📋</div>
      <p>No notes yet. Create one to share with your family.</p>
    </div>`;
    return;
  }

  // Filter with the shared matcher over the fields logic.js declares searchable.
  const list = searchQ ? notes.filter(n => searchMatch(searchQ, searchableFields(n))) : notes;
  if (list.length === 0) {
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1">
      <div class="empty-icon">🔍</div>
      <p>No notes match "${esc(searchQ)}".</p>
    </div>`;
    return;
  }

  grid.innerHTML = list.map(n => `
    <div class="note-card"${n._pending ? ' style="opacity:.6"' : ""}>
      <div class="note-card-header">
        <span class="note-title">${esc(n.title)}</span>
        ${n._pending || !CAN_WRITE ? "" : `<div class="note-actions">
          <button class="btn btn-ghost btn-sm" data-action="edit" data-id="${esc(n.id)}">Edit</button>
          <button class="btn btn-danger btn-sm" data-action="delete" data-id="${esc(n.id)}">Delete</button>
        </div>`}
      </div>
      ${n.content
        ? `<p class="note-content">${esc(n.content)}</p>`
        : `<p class="note-content" style="font-style:italic;opacity:.5">Empty</p>`}
      <p class="note-meta">By ${esc(memberName(n.createdBy))} · ${formatRelativeDate(n.updatedAt)}</p>
    </div>`).join("");
}

// ── Form ──────────────────────────────────────────────────────────────────────
function showForm(existing = null) {
  editingId = existing?.id ?? null;
  const area = document.getElementById("form-area");
  area.innerHTML = `
    <div class="form-card">
      <h2>${existing ? "Edit Note" : "New Note"}</h2>
      <div class="form-group">
        <label>Title</label>
        <input id="f-title" type="text" value="${esc(existing?.title ?? "")}" placeholder="e.g. Wifi Password" data-autofocus />
      </div>
      <div class="form-group">
        <label>Content</label>
        <textarea id="f-content" placeholder="Write anything…">${esc(existing?.content ?? "")}</textarea>
      </div>
      <div class="form-actions">
        <button class="btn btn-ghost" onclick="cancelForm()">Cancel</button>
        <button class="btn btn-primary" id="f-submit">${existing ? "Save" : "Create"}</button>
      </div>
    </div>`;

  document.getElementById("f-submit").addEventListener("click", submitForm);
  document.getElementById("f-title").addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); submitForm(); }
  });
  document.getElementById("f-title").focus();
}

function cancelForm() {
  editingId = null;
  document.getElementById("form-area").innerHTML = "";
}

async function submitForm() {
  const title   = document.getElementById("f-title").value.trim();
  const content = document.getElementById("f-content").value;
  if (!title) { document.getElementById("f-title").focus(); return; }

  const now = new Date().toISOString();
  const isNew = !editingId;
  const noteId = editingId ?? crypto.randomUUID();

  // Optimistic update
  if (isNew) {
    const optimistic = { id: noteId, title, content, createdBy: HUB_MEMBER?.id ?? "unknown", updatedAt: now, _pending: true };
    notes.unshift(optimistic);
    notesMap.set(noteId, optimistic);
  } else {
    const existing = notesMap.get(noteId);
    const updated = { ...existing, title, content, updatedAt: now };
    notesMap.set(noteId, updated);
    const idx = notes.findIndex(n => n.id === noteId);
    if (idx !== -1) notes[idx] = updated;
  }
  cancelForm();
  render();

  try {
    if (isNew) {
      await db(
        "INSERT INTO app_notes__notes (id, title, content, created_by, created_at, updated_at) VALUES (?, ?, ?, ?, ?, ?)",
        [noteId, title, content, HUB_MEMBER?.id ?? "unknown", now, now]
      );
    } else {
      await db(
        "UPDATE app_notes__notes SET title = ?, content = ?, updated_at = ? WHERE id = ?",
        [title, content, now, noteId]
      );
    }
    await load();
  } catch (e) {
    showError(e.message);
    await load();
  }
}

// ── Actions ───────────────────────────────────────────────────────────────────
window.startEdit = (id) => {
  const note = notesMap.get(id);
  if (note) showForm(note);
};

window.removeNote = async (id) => {
  const note = notesMap.get(id);
  if (!note || !await hubConfirm({ message: `Delete "${note.title}"?`, confirmLabel: "Delete", destructive: true })) return;

  notesMap.delete(id);
  notes = notes.filter(n => n.id !== id);
  render();

  try {
    await db("DELETE FROM app_notes__notes WHERE id = ?", [id]);
  } catch (e) {
    showError(e.message);
    await load();
  }
};

// ── Error display ─────────────────────────────────────────────────────────────
function showError(msg) {
  const area = document.getElementById("error-area");
  area.innerHTML = `<div class="error-banner">Error: ${esc(msg)}</div>`;
  setTimeout(() => { area.innerHTML = ""; }, 5000);
}

// ── Init ──────────────────────────────────────────────────────────────────────
const newBtn = document.getElementById("new-btn");
// Read-only members (everyone but the steward in a roster, non-adults in a
// household) never see the "new note" control — writes would be rejected.
if (CAN_WRITE) newBtn.style.display = "";
newBtn.addEventListener("click", () => showForm());

document.getElementById("search-input").addEventListener("input", (e) => {
  searchQ = e.target.value;
  render();
});

// Delegated handler: note ids are user-controllable (any member can INSERT a note
// with an attacker-chosen id via raw /api/db), so they must never be interpolated
// into an inline handler. Read them back from data-id instead.
document.getElementById("notes-grid").addEventListener("click", (e) => {
  const btn = e.target.closest("[data-action]");
  if (!btn) return;
  const id = btn.getAttribute("data-id");
  if (btn.dataset.action === "edit") startEdit(id);
  else if (btn.dataset.action === "delete") removeNote(id);
});

(async () => { await loadMembers(); await load(); })();
</script>
</body>
</html>
